[project]
name = "gst"
version = "0.1.0"
description = "Speaking-drill practice videos built from German course transcripts."
readme = "README.md"
authors = [
    { name = "MiladBahariQaragoz", email = "milaawd@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "edge-tts>=7.2.8",
    "pillow>=12.3.0",
    "piper-tts>=1.8.0",
]

[project.scripts]
gst = "gst.cli:main"

[project.optional-dependencies]
elevenlabs = [
    "httpx>=0.28.1",
]
jev = [
    "typesafe-sdk>=0.7",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs real external tools or models (deselect with -m 'not slow')",
    "network: calls an online service; run explicitly with -m network",
]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# Word lists read better as one whitespace-separated block than as huge list literals.
ignore = ["SIM905"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
