[project]
name = "gst"
version = "0.1.0"
description = "Speaking-drill practice videos built from German course transcripts."
readme = "README.md"
authors = [
    { name = "MiladBahariQaragoz", email = "milaawd@outlook.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
gst = "gst.cli:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs real external tools or models (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# Word lists read better as one whitespace-separated block than as huge list literals.
ignore = ["SIM905"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
